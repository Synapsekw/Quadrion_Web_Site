# Static marketing pages plus Quori's server-side chat and enquiry functions.
[build]
  publish = "directions"
  command = "npm run build:portal && npm run check:public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--ignore-scripts"
  # Public configuration may legitimately appear in source and deployment docs.
  # Keep scanning enabled for all provider, session and Grokbot credentials.
  SECRETS_SCAN_OMIT_KEYS = "QUORI_ALLOWED_ORIGINS,QUORI_MODEL,QUORI_PROVIDER_ENDPOINT,QUORI_REASONING_EFFORT,QUORI_TOKEN_PARAMETER,QUORI_OUTPUT_TOKENS"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/knowledge.txt"]

# Home goes to the current page. A redirect (not a rewrite) keeps its relative paths working.
[[redirects]]
  from = "/"
  to = "/d3-quarter/"
  status = 301
  force = true

# Overview of all directions.
[[redirects]]
  from = "/overview"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/portal/*"
  to = "/portal/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[headers]]
  for = "/portal/*"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob: https://oxjrkodcmflxejdwsuac.supabase.co; media-src 'self' blob: https://oxjrkodcmflxejdwsuac.supabase.co; connect-src 'self' https://oxjrkodcmflxejdwsuac.supabase.co https://oxjrkodcmflxejdwsuac.storage.supabase.co; font-src 'self'; worker-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob: https://oxjrkodcmflxejdwsuac.supabase.co; media-src 'self' blob: https://oxjrkodcmflxejdwsuac.supabase.co; connect-src 'self' https://oxjrkodcmflxejdwsuac.supabase.co https://oxjrkodcmflxejdwsuac.storage.supabase.co; font-src 'self'; worker-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

# Links shared before the publish folder changed.
[[redirects]]
  from = "/directions/*"
  to = "/:splat"
  status = 301

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Access-Control-Allow-Origin = "*"

# The install manifest and worker must be checked for updates on every visit.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/assets/fonts/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[redirects]]
  from = "https://quadrionai.netlify.app/*"
  to = "https://quadrion.ai/:splat"
  status = 301
  force = true
