<!doctype html>
<html><head><meta charset="utf-8"><title>data test</title>
<style>html,body{margin:0;background:#0B0F13;color:#EEF2F5;font:12px monospace}#log{position:fixed;left:8px;top:8px;white-space:pre}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body><div id="log"></div>
<script type="module">
import * as THREE from 'three';
import { samplePoints, load, roadOrtho } from './quadrion-data.js';
const name = new URLSearchParams(location.search).get('a') || 'plant';
const mode = new URLSearchParams(location.search).get('m') || 'points';
const log = (s) => (document.getElementById('log').textContent += s + '\n');
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.append(r.domElement);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 5000);
cam.position.set(16, 12, 16); cam.lookAt(0, 3, 0);
try {
  const t0 = performance.now();
  if (mode === 'points') {
    const s = await samplePoints(name, 120000, 10);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(s.positions, 3));
    g.setAttribute('color', new THREE.BufferAttribute(s.colors, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 0.05, vertexColors: true })));
    log(`${name}: sampled ${s.positions.length / 3} pts in ${(performance.now() - t0) | 0} ms, native size ${s.size.toArray().map((v) => v.toFixed(1))}`);
  } else {
    const a = await load(name);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 2.5));
    let obj = a.model || a.e2;
    if (name === 'road') { obj = new THREE.Group(); obj.add(roadOrtho(a.road, 3), a.pciMesh, a.centreline, a.defectPoints); }
    scene.add(obj);
    if (Array.isArray(a.patches)) a.patches.forEach((p) => scene.add(p.mesh)); else if (a.patches) scene.add(a.patches);
    await new Promise((r) => setTimeout(r, 2500));
    const box = new THREE.Box3().setFromObject(obj), c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3()).length();
    cam.position.copy(c).add(new THREE.Vector3(sz * 0.6, sz * 0.4, sz * 0.6)); cam.near = sz / 1000; cam.far = sz * 10; cam.updateProjectionMatrix(); cam.lookAt(c);
    log(`${name}: model loaded in ${(performance.now() - t0) | 0} ms, size ${box.getSize(new THREE.Vector3()).toArray().map((v) => v.toFixed(1))}` + (a.findings ? `, findings ${a.findings.length}` : '') + (a.patches ? `, patches ${a.patches.length}` : ''));
  }
  r.render(scene, cam); document.title = 'ok';
  setInterval(() => r.render(scene, cam), 500);
} catch (e) { log('ERROR ' + e.stack); document.title = 'error'; }
</script></body></html>
